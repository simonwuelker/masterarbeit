[package]
name = "palrup"
version = "0.1.0"
edition = "2021"

[features]
overlap = ["dep:apache-datasketches"]

[dependencies]
anyhow = { workspace = true }
apache-datasketches = { version = "0.2.3", default-features = false, features = ["theta"], optional=true }
bytemuck = "1.25.2"
clap = { version = "3", features = ["derive"] }
env_logger = "0.11.11"
growable-bloom-filter = "2.1.1"
log = { workspace = true }
rayon = { workspace = true }
regex = "1.13.1"
rustc-hash = "2.1.3"
serde = { version = "1.0.228", features = ["serde_derive"] }
serde_json = "1.0.150"
tabled = "0.18.0"
palrup-io = { workspace = true }
gethostname = "1.1.0"
process_control = "5.2.0"
palrup-proof-graph = { workspace = true }
